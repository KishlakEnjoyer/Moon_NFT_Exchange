services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL}
        REACT_APP_IMAGES_URL: ${REACT_APP_IMAGES_URL}
        REACT_APP_FRONT_URL: ${REACT_APP_FRONT_URL}
    container_name: moon_frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - moon_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moon_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./.env
    restart: unless-stopped
    volumes:
      - ./images:/app/images
    depends_on:
      - db
      - redis
      - ganache
    networks:
      - moon_net

  tg-bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: moon_tgbot
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - moon_net

  vk-bot:
    build:
      context: ./vk_bot
      dockerfile: Dockerfile
    container_name: moon_vkbot
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - moon_net

  db:
    image: mysql:8.0
    container_name: moon_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - moon_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - moon_net

  redis:
    image: redis:7-alpine
    container_name: moon_redis
    restart: unless-stopped
    networks:
      - moon_net

  ganache:
    image: trufflesuite/ganache:latest
    container_name: moon_ganache
    command: --host 0.0.0.0 --port 8545 --database.dbPath /data --wallet.mnemonic "since topple flame hold grab video camera melody device task wisdom useful"
    volumes:
      - ganache_data:/data
    restart: unless-stopped
    networks:
      - moon_net

  images:
    image: nginx:alpine
    container_name: moon_images
    volumes:
      - ./images:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${IMAGES_PORT:-5001}:80"
    restart: unless-stopped
    networks:
      - moon_net

volumes:
  moon_db_data:
  ganache_data:

networks:
  moon_net:
    driver: bridge
