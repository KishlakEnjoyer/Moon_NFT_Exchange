services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moon_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    volumes:
      - ./images:/app/images
      - ./backend/ml:/app/ml
      - ./hf_cache:/app/.cache/huggingface
      - ./sentence_transformers_cache:/app/.cache/sentence_transformers
    depends_on:
      - db
      - redis
    networks:
      - moon_net

  recsys-trainer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moon_recsys_trainer
    command: python ml/retrain_loop.py
    env_file:
      - ./.env
    environment:
      RECSYS_RETRAIN_INTERVAL_SECONDS: ${RECSYS_RETRAIN_INTERVAL_SECONDS:-10800}
    restart: unless-stopped
    volumes:
      - ./backend/ml:/app/ml
    depends_on:
      - db
    networks:
      - moon_net

  tg-bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: moon_tgbot
    env_file:
      - ./.env
    restart: always
    depends_on:
      - backend
    networks:
      - moon_net

  vk-bot:
    build:
      context: ./vk_bot
      dockerfile: Dockerfile
    container_name: moon_vkbot
    env_file:
      - ./.env
    restart: always
    depends_on:
      - backend
    networks:
      - moon_net

  db:
    image: mysql:8.0
    container_name: moon_db
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - moon_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - moon_net

  redis:
    image: redis:7-alpine
    container_name: moon_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - moon_net

  ganache:
    image: trufflesuite/ganache:latest
    container_name: moon_ganache
    command: --host 0.0.0.0 --port 8545 --database.dbPath /data --wallet.mnemonic "since topple flame hold grab video camera melody device task wisdom useful"
    ports:
      - "8545:8545"
    volumes:
      - ganache_data:/data
    restart: unless-stopped
    networks:
      - moon_net

  images:
    image: nginx:alpine
    container_name: moon_images
    volumes:
      - ./images:/usr/share/nginx/html:ro
    ports:
      - "${IMAGES_PORT:-5001}:80"
    restart: unless-stopped
    networks:
      - moon_net

volumes:
  moon_db_data:
  ganache_data:

networks:
  moon_net:
    driver: bridge
