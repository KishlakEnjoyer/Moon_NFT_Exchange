services:

  # 1. Ganache — Local Ethereum blockchain
  ganache:
    image: trufflesuite/ganache:latest
    container_name: ganache
    ports:
      - "8545:8545"
    command: >
      --database.dbPath /data
      --wallet.deterministic
      --host 0.0.0.0
    volumes:
      - ./ganache-data:/data

  # 3. Deploy contracts
  deployer:
    build:
      context: ./block-chain
    container_name: deployer
    depends_on:
      - ganache
    environment:
      - DOCKER=true
      - HARDHAT_RPC_URL=http://ganache:8545
    volumes:
      - ./backend:/backend
    command: >
      sh -c "sleep 5 &&
             npx hardhat run scripts/deploy.js --network localhost"

  # 4. FastAPI backend
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - ganache
      - deployer
    env_file:
      - .env
    volumes:
      - ./backend:/app

volumes:
  mysql-data: